[project]
name = "synthetic-call"
version = "0.1.0"
description = "Generate a shareable synthetic three-person call with ground truth, and score runs against it"
requires-python = "==3.12.13"
dependencies = [
    "mlx-audio==0.6.1",
    "mlx==0.32.4",
    "soundfile==0.12.1",
    "numpy<2.3",
    "scipy==1.18.1",
    "opencc-python-reimplemented==0.1.7",
    "f5-tts-mlx==0.2.6",
    "mlx-whisper==0.4.2",
]

[tool.uv]
package = false
